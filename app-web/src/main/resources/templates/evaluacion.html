<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Evaluación médica</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="page">
    <div class="container">

        <div class="header">
            <h1>Evaluación médica</h1>
            <p>Formulario inicial del paciente realizado por el médico</p>
        </div>

        <form th:action="@{|/tasks/${id}/medica|}"
            th:object="${evaluacion}"
            method="post">

            <div class="card">
                <h2>Datos de prueba</h2>

                <div class="actions">
                    <button type="button" class="btn btn-secondary" onclick="rellenarEvaluacionMedicaDemo()">
                        Rellenar datos de prueba
                    </button>
                </div>
            </div>

            <div class="card">
                <h2>Datos del paciente</h2>

                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" th:field="*{nombre}" placeholder="Ej: Laura">
                </div>

                <div class="form-group">
                    <label>Apellidos</label>
                    <input type="text" th:field="*{apellidos}" placeholder="Ej: García López">
                </div>

                <div class="form-group">
                    <label>Edad</label>
                    <input type="number" th:field="*{edad}" placeholder="Ej: 45">
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" th:field="*{email}" placeholder="Ej: paciente@email.com">
                </div>

                <div class="form-group">
                    <label>Patologías</label>
                    <textarea th:field="*{patologias}" rows="3" placeholder="Ej: hipertensión, diabetes, lesión lumbar..."></textarea>
                </div>
            </div>

            <div class="card">
                <h2>Datos clínicos básicos</h2>

                <div class="form-group">
                    <label>Peso (kg)</label>
                    <input type="number" step="0.1" th:field="*{pesoKg}" placeholder="Ej: 72.5">
                </div>

                <div class="form-group">
                    <label>Altura (cm)</label>
                    <input type="number" step="0.1" th:field="*{alturaCm}" placeholder="Ej: 170">
                </div>

                <div class="form-group">
                    <label>Tensión arterial</label>
                    <input type="text" th:field="*{tensionArterial}" placeholder="Ej: 120/80">
                </div>

                <div class="form-group">
                    <label>Frecuencia cardiaca en reposo (bpm)</label>
                    <input type="number" th:field="*{frecuenciaCardiacaReposo}" placeholder="Ej: 68">
                </div>

                <div class="form-group">
                    <label>Medicación actual</label>
                    <input type="text" th:field="*{medicacionActual}" placeholder="Ej: antihipertensivos, antiinflamatorios...">
                </div>

                <div class="form-group">
                    <label>Nivel de actividad</label>
                    <select th:field="*{nivelActividad}">
                        <option value="">-- Selecciona --</option>
                        <option value="SEDENTARIO">Sedentario</option>
                        <option value="MODERADO">Moderado</option>
                        <option value="ACTIVO">Activo</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Riesgo cardiovascular</label>
                    <select th:field="*{riesgoCardiovascular}">
                        <option value="">-- Selecciona --</option>
                        <option value="BAJO">Bajo</option>
                        <option value="MEDIO">Medio</option>
                        <option value="ALTO">Alto</option>
                    </select>
                </div>
            </div>

            <div class="card">
                <h2>Riesgo y restricciones</h2>

                <div class="form-group">
                    <label>Dolor actual 0-10</label>
                    <input type="number" min="0" max="10" th:field="*{dolorActual}" placeholder="Ej: 4">
                </div>

                <div class="form-group">
                    <label>Zona de dolor</label>
                    <input type="text" th:field="*{zonaDolor}" placeholder="Ej: rodilla derecha, zona lumbar...">
                </div>

                <div class="form-group">
                    <label>Contraindicaciones</label>
                    <textarea th:field="*{contraindicaciones}" rows="3" placeholder="Ej: evitar impacto, evitar cargas altas..."></textarea>
                </div>

                <div class="form-group">
                    <label>Objetivo principal</label>
                    <select th:field="*{objetivoPrincipal}">
                        <option value="REHABILITACION">Rehabilitación</option>
                        <option value="PERDIDA_PESO">Pérdida de peso</option>
                        <option value="FUERZA">Ganancia de fuerza</option>
                        <option value="RESISTENCIA">Resistencia</option>
                        <option value="MOVILIDAD">Movilidad</option>
                        <option value="OTRO">Otro</option>
                    </select>
                </div>

                <div class="info-block">
                    <div class="form-group">
                        <label>
                            <input type="checkbox" th:field="*{necesitaRevisionFisioterapeuta}">
                            Necesita revisión por fisioterapeuta
                        </label>
                    </div>

                    <p>
                        Si marcas esta opción, el proceso continuará hacia la tarea de evaluación física para fisio1.
                    </p>
                </div>
            </div>

            <div class="card">
                <h2>Finalizar evaluación</h2>

                <div class="actions">
                    <button type="submit" class="btn btn-primary">
                        Completar evaluación médica
                    </button>

                    <a th:href="@{/tasks}" class="btn btn-secondary">
                        Volver a tareas
                    </a>
                </div>
            </div>

        </form>

    </div>
</div>

<script>
    function setCampo(nombre, valor) {
        const campo = document.querySelector('[name="' + nombre + '"]');

        if (!campo) {
            return;
        }

        if (campo.type === 'checkbox') {
            campo.checked = valor === true;
            return;
        }

        campo.value = valor;
    }

    function rellenarEvaluacionMedicaDemo() {
        setCampo('nombre', 'Lucía');
        setCampo('apellidos', 'Martínez García');
        setCampo('edad', '45');
        setCampo('email', 'carmenesau1999@gmail.com');

        setCampo('patologias', 'Dolor lumbar recurrente y molestias ocasionales en rodilla derecha.');

        setCampo('pesoKg', '72.5');
        setCampo('alturaCm', '168');
        setCampo('tensionArterial', '120/80');
        setCampo('frecuenciaCardiacaReposo', '68');
        setCampo('medicacionActual', 'Ninguna');

        setCampo('nivelActividad', 'MODERADO');
        setCampo('riesgoCardiovascular', 'BAJO');

        setCampo('dolorActual', '4');
        setCampo('zonaDolor', 'Zona lumbar');
        setCampo('contraindicaciones', 'Evitar impacto alto y cargas excesivas al inicio.');

        setCampo('objetivoPrincipal', 'FUERZA');
        setCampo('necesitaRevisionFisioterapeuta', true);
    }
</script>

</body>
</html>
