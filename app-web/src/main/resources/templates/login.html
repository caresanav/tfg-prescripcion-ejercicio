<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="page">

<div class="container">

    <div class="header">
        <h1>Iniciar sesión</h1>
        <p>Accede al sistema de prescripción de ejercicio físico.</p>
    </div>

    <div class="card">

        <div th:if="${param.error}" class="info-block">
            Usuario o contraseña incorrectos.
        </div>

        <div th:if="${param.logout}" class="info-block">
            Has cerrado sesión correctamente.
        </div>

        <form th:action="@{/login}" method="post">

            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" placeholder="medico, fisio1, fisio2 o admin" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="1234" required>
            </div>

            <div class="actions">
                <button type="submit" class="btn btn-primary">Entrar</button>
            </div>

        </form>

    </div>

</div>

</body>
</html>
